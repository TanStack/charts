# domain_map.yaml
# Generated by TanStack Intent domain discovery
# Library: @tanstack/charts
# Version: 0.9.0 plus the current checkout
# Date: 2026-08-12
# Status: reviewed

status: reviewed

library:
  name: '@tanstack/charts'
  version: '0.9.0 + current checkout'
  repository: 'https://github.com/TanStack/charts'
  description: 'A typed, renderer-neutral visualization grammar for responsive application charts.'
  primary_framework: 'framework-agnostic'

discovery:
  maintainer_interview: 'skipped after two explicit confirmations'
  prioritization_basis:
    - 'canonical documentation'
    - 'API-FRICTION.md findings F-001 through F-257'
    - 'current source assertions and adapter implementations'
    - 'CHANGELOG.md migrations'
    - 'TanStack/charts GitHub issues'
    - 'current official TanStack Table, DB, Query, Router, Store, Virtual, Pacer, Start, and Form documentation'

authoring_contract:
  boundary: >-
    Skills add judgment, sequencing, diagnosis, migration strategy, and proof.
    They link to canonical documentation for signatures and option inventories
    instead of reproducing reference pages.
  scenario_schema:
    - trigger
    - inspect
    - decide
    - build
    - verify
  compact_rule: >-
    Each scenario should state the decision and its proof in the smallest useful
    form. Add code only where the wrong and correct patterns are not obvious.
  default_trigger: >-
    Load design-a-chart whenever a user asks to graph, chart, visualize, compare,
    forecast, project, explain, or communicate a metric.
  misleading_request_policy: >-
    State the analytical mismatch and recommend a truthful form. If the user
    retains the requested form, preserve the data semantics and make the
    limitation explicit instead of silently changing the claim.
  migration_reference_policy: >-
    Generate first-class references for Observable Plot, Recharts, Chart.js,
    ECharts, and direct D3. Handle other libraries through the shared semantic
    migration workflow until repository evidence justifies another reference.
  react_native_policy: >-
    Load React Native guidance only when the request or inspected code targets
    React Native. Mark device, gesture, accessibility, and performance claims
    that still require application-level validation.

domains:
  - name: 'Frame the visualization'
    slug: 'frame-the-visualization'
    description: 'Turn a user question and metric into an honest visual task with explicit comparison and evidence goals.'
  - name: 'Encode application data'
    slug: 'encode-application-data'
    description: 'Prepare semantic rows and express them through marks, scales, guides, color, and composed views.'
  - name: 'Adapt chart behavior'
    slug: 'adapt-chart-behavior'
    description: 'Make charts respond correctly to containers, interaction, application state, updates, and motion.'
  - name: 'Ship and evolve charts'
    slug: 'ship-and-evolve-charts'
    description: 'Migrate, integrate, extend, test, and deliver charts across renderers and frameworks.'

skills:
  - name: 'Design a chart from a user goal'
    slug: 'design-a-chart'
    domain: 'frame-the-visualization'
    description: 'Choose the comparison, data semantics, visual form, and explanatory evidence before authoring TanStack marks.'
    type: 'core'
    packages: ['@tanstack/charts']
    covers:
      - 'user stories and decisions'
      - 'metric semantics, units, denominators, and time grain'
      - 'comparison, distribution, relationship, composition, flow, hierarchy, and spatial tasks'
      - 'forecast, target, uncertainty, and annotation strategy'
      - 'chart acceptance criteria'
    tasks:
      - 'Graph a product metric for an operational dashboard.'
      - 'Explain a KPI change to an executive or customer.'
      - 'Choose a visual for actuals, forecasts, targets, and uncertainty.'
    reference_candidates:
      - topic: 'analytical task and visual-form matrix'
        reason: 'Comparison, trend, distribution, relationship, composition, flow, hierarchy, spatial, target, and projection stories need distinct evidence and encoding checks.'
    failure_modes:
      - mistake: 'Starting with a requested chart type'
        mechanism: 'A familiar chart can answer a different question than the user actually needs, producing a polished but irrelevant encoding.'
        source: 'docs/guides/choosing-a-chart.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Showing a rate without its denominator'
        mechanism: 'Percentages and normalized values hide volume, sample size, or the basis of comparison unless the denominator is carried into the story or tooltip.'
        source: 'API-FRICTION.md F-217; docs/reference/transforms.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Rendering projections as observed history'
        mechanism: 'A continuous visual treatment implies equal certainty; forecast boundaries and uncertainty need an explicit channel, interval, or annotation.'
        source: 'docs/examples/lines-and-areas.md; docs/reference/marks/difference.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Choosing area or angle for precise ranking'
        mechanism: 'Area, radial, and stacked encodings emphasize part-to-whole or shape; aligned position and length are better when exact ordering is the goal.'
        source: 'docs/guides/choosing-a-chart.md; docs/examples/bars-and-rankings.md'
        priority: 'HIGH'
        status: 'active'

  - name: 'Prepare chart data'
    slug: 'prepare-chart-data'
    domain: 'encode-application-data'
    description: 'Shape, aggregate, order, and derive semantic rows while preserving the analytical decision and source lineage.'
    type: 'core'
    packages: ['@tanstack/charts']
    covers:
      - 'mark-local source data'
      - 'fold, group, bin, stack, normalize, rank, rolling, cumulative, regression, and hierarchy transforms'
      - 'ordering, missing values, derived rows, and lineage'
      - 'framework memoization of eager transforms'
    tasks:
      - 'Turn event rows into daily rates, rolling windows, or ranked categories.'
      - 'Prepare histograms, boxplots, stacks, mosaics, or hierarchy inputs.'
      - 'Preserve drill-down data through multiple transforms.'
    reference_candidates:
      - topic: 'transform selection and output contracts'
        reason: 'The transform families have distinct grouping, ordering, lineage, empty-value, and interval semantics.'
    failure_modes:
      - mistake: 'Sorting a line after creating its mark'
        mechanism: 'Line and area marks use input order as path order; scale order does not reorder path topology.'
        wrong_pattern: |
          const mark = lineY(rows, { x: 'date', y: 'value' })
          rows.sort((a, b) => +a.date - +b.date)
        correct_pattern: |
          const ordered = [...rows].sort((a, b) => +a.date - +b.date)
          const mark = lineY(ordered, { x: 'date', y: 'value' })
        source: 'docs/reference/marks/line-and-area.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Running eager transforms inside responsive builders'
        mechanism: 'Responsive builders may run again for size and layout changes, so uncached data work repeats even when source rows are unchanged.'
        wrong_pattern: |
          defineChart(({ width }) => ({
            marks: [lineY(rollingWindow(rows, options), channels)],
          }))
        correct_pattern: |
          const prepared = rollingWindow(rows, options)
          defineChart(({ width }) => ({
            marks: [lineY(prepared, channels)],
          }))
        source: 'docs/guides/transforms-and-reactivity.md; API-FRICTION.md F-128'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Manually accumulating ordinary stacks'
        mechanism: 'Case-owned running totals mishandle negative values, missing series, configured order, and later updates even though native stack layouts own those semantics.'
        wrong_pattern: |
          const start = totals.get(row.x) ?? 0
          return { ...row, y1: start, y2: start + row.value }
        correct_pattern: |
          barY(rows, {
            x: 'x', y: 'value', z: 'series', layout: stack(),
          })
        source: 'https://github.com/TanStack/charts/issues/9; API-FRICTION.md F-163'
        priority: 'HIGH'
        status: 'fixed-but-legacy-risk'
        version_context: 'Common in early examples before native stack and group layouts matured.'
      - mistake: 'Flattening derived rows without lineage'
        mechanism: 'Tooltips, selection, drill-down, and later transforms lose the contributing source records when application preparation drops direct lineage.'
        source: 'docs/reference/transforms.md; docs/guides/transforms-and-reactivity.md'
        priority: 'HIGH'
        status: 'active'

  - name: 'Compose marks and views'
    slug: 'compose-marks-and-views'
    domain: 'encode-application-data'
    description: 'Translate semantic encodings into layered marks, annotations, facets, and coordinated views without duplicating geometry engines.'
    type: 'core'
    packages: ['@tanstack/charts']
    covers:
      - 'mark selection and layer order'
      - 'bars, intervals, lines, areas, distributions, spatial, polar, network, and hierarchy compositions'
      - 'facets and named view composition'
      - 'decorative versus interactive ownership'
    tasks:
      - 'Layer an area, line, target, annotation, and selected points.'
      - 'Build small multiples or a chart with marginal summaries.'
      - 'Choose between built-in composites, ordinary marks, and a custom mark.'
    reference_candidates:
      - topic: 'mark decision matrix'
        reason: 'The package exposes many mark families whose important distinction is semantic ownership, not option syntax.'
    failure_modes:
      - mistake: 'Encoding the whole chart as one custom path'
        mechanism: 'A monolithic path discards mark-local data, typed channels, automatic domains, point ownership, renderer portability, and reusable interaction.'
        source: 'docs/concepts/grammar-of-graphics.md; docs/guides/custom-marks-and-renderers.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Expecting an area to draw its boundary line'
        mechanism: 'Area and line are separate layers; relying on an implicit outline loses independent styling, state, and point ownership.'
        wrong_pattern: |
          marks: [areaY(rows, { x: 'date', y: 'value' })]
        correct_pattern: |
          marks: [
            areaY(rows, { x: 'date', y: 'value' }),
            lineY(rows, { x: 'date', y: 'value' }),
          ]
        source: 'docs/reference/marks/line-and-area.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Letting decorative layers own duplicate points'
        mechanism: 'Every interactive child can create another focus and tooltip candidate, so summaries, fills, guides, and labels need deliberate point ownership.'
        source: 'API-FRICTION.md F-218; docs/guides/tooltips-and-focus.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['compose-marks-and-views', 'build-chart-interactions']
      - mistake: 'Rebuilding supported coordinate systems in userland'
        mechanism: 'Case-owned polar, spatial, hierarchy, and network projection hides responsive final-bounds work and duplicates optional capability modules.'
        source: 'API-FRICTION.md F-117, F-199 through F-208; docs/examples/index.md'
        priority: 'HIGH'
        status: 'fixed-but-legacy-risk'

  - name: 'Configure scales, guides, and color'
    slug: 'configure-scales-guides-color'
    domain: 'encode-application-data'
    description: 'Assign semantic domains, responsive ranges, axes, legends, and paint while keeping scale and grouping ownership explicit.'
    type: 'core'
    packages: ['@tanstack/charts']
    covers:
      - 'compact and D3 scale factories versus configured instances'
      - 'domains, responsive ranges, reversal, nicening, and log constraints'
      - 'axes, tick collision, margins, legends, and color semantics'
      - 'z grouping, color values, and final paint overrides'
    tasks:
      - 'Choose a numeric, temporal, categorical, log, or color scale.'
      - 'Share or lock domains across comparisons.'
      - 'Keep labels and legends legible without corrupting chart geometry.'
    reference_candidates:
      - topic: 'scale and guide ownership matrix'
        reason: 'Factories, configured instances, compact scales, D3 families, color kinds, and guide policies form a dense decision surface.'
    failure_modes:
      - mistake: 'Assigning positional pixel ranges in application code'
        mechanism: 'Charts owns final responsive ranges after guide margins resolve; an authored range becomes stale and may invert or misalign geometry.'
        wrong_pattern: |
          x: { scale: scaleLinear().range([0, 640]) }
        correct_pattern: |
          x: { scale: scaleLinear }
        source: 'API-FRICTION.md F-002; docs/concepts/scales-and-d3.md'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['configure-scales-guides-color', 'design-responsive-charts']
      - mistake: 'Using a default instance for inferred domains'
        mechanism: 'A scale instance owns its domain; passing scaleLinear() retains its default domain instead of inferring from mark channels.'
        wrong_pattern: |
          y: { scale: scaleLinear() }
        correct_pattern: |
          y: { scale: scaleLinear }
        source: 'CHANGELOG.md 0.0.1 breaking migrations; docs/concepts/scales-and-d3.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Using color as geometry identity accidentally'
        mechanism: 'When z is absent, discrete color may also group paths or bars; a later paint change can therefore alter topology.'
        wrong_pattern: |
          lineY(rows, { x: 'date', y: 'value', color: 'status' })
        correct_pattern: |
          lineY(rows, {
            x: 'date', y: 'value', z: 'series', color: 'status',
          })
        source: 'API-FRICTION.md F-009 and F-013; docs/concepts/data-and-channels.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Treating containment as collision avoidance'
        mechanism: 'Automatic margins keep labels inside the surface; they do not thin, rotate, or prioritize tick labels that overlap one another.'
        source: 'API-FRICTION.md F-023 and F-160; docs/guides/responsive-charts.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['configure-scales-guides-color', 'design-responsive-charts']

  - name: 'Design responsive charts'
    slug: 'design-responsive-charts'
    domain: 'adapt-chart-behavior'
    description: 'Make information, layout, labels, and final-pixel geometry adapt to the chart container and resolved plot.'
    type: 'core'
    packages: ['@tanstack/charts']
    covers:
      - 'container sizing, height, aspect ratio, and initialWidth'
      - 'responsive definitions and information priority'
      - 'automatic margins and label-density policy'
      - 'surface bounds versus final plot bounds'
      - 'responsive topology and resolved-layout marks'
    tasks:
      - 'Make a dashboard chart work from 280 pixels to a wide panel.'
      - 'Choose what hides, aggregates, rotates, facets, or becomes a table.'
      - 'Author pixel-space layouts that use final inner bounds.'
    failure_modes:
      - mistake: 'Adapting to viewport width instead of container width'
        mechanism: 'Dashboard panels, sidebars, embeds, and nested layouts can be narrow inside a wide viewport; the host measurement is the relevant constraint.'
        wrong_pattern: |
          const compact = window.innerWidth < 640
        correct_pattern: |
          defineChart(({ width }) => ({
            marks, x: { ticks: width < 420 ? 4 : 8 },
          }))
        source: 'docs/guides/responsive-charts.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Using surface width as final plot width'
        mechanism: 'Guides, legends, and automatic margins shrink the final plot; pixel preparation against the surface produces clipped or misaligned marks.'
        source: 'API-FRICTION.md F-116 and F-219; docs/guides/responsive-charts.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Assuming resize only stretches existing geometry'
        mechanism: 'Facets, waffle packing, treemaps, Delaunay links, hexbins, density contours, and label fit can change topology when final bounds change.'
        source: 'docs/reference/marks/waffle.md; docs/reference/marks/treemap.md; docs/reference/marks/delaunay.md; docs/reference/marks/hexbin.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Using fixed width for ordinary application charts'
        mechanism: 'A fixed width opts out of normal container measurement; omitted initialWidth and flex min-width constraints also cause unstable SSR or overflow.'
        wrong_pattern: |
          <Chart definition={chart} width={640} ariaLabel="Revenue" />
        correct_pattern: |
          <Chart definition={chart} height={320} initialWidth={640}
            ariaLabel="Revenue" />
        source: 'docs/guides/responsive-charts.md; API-FRICTION.md F-111'
        priority: 'HIGH'
        status: 'active'

  - name: 'Build chart interactions'
    slug: 'build-chart-interactions'
    domain: 'adapt-chart-behavior'
    description: 'Compose focus, tooltips, selection, cursors, brushing, and zoom as semantic controlled behavior with keyboard parity.'
    type: 'core'
    packages: ['@tanstack/charts']
    covers:
      - 'focus strategies and point ownership'
      - 'native and composed tooltips, portals, pinning, and anchors'
      - 'controlled keyed selection, cursor, brush, and zoom'
      - 'pointer and keyboard equivalence'
      - 'cross-chart coordination'
    tasks:
      - 'Add grouped time-series tooltips and a crosshair.'
      - 'Coordinate selection between a chart and table.'
      - 'Build controlled brush, cursor, or zoom behavior.'
    reference_candidates:
      - topic: 'interaction state machines'
        reason: 'Focus, tooltip, selection, cursor, brush, zoom, pinning, and host ownership each have distinct transition semantics.'
    failure_modes:
      - mistake: 'Mutating rendered SVG for focus presentation'
        mechanism: 'DOM mutation bypasses scene identity, renderer portability, SSR, Canvas, React Native, motion, and cleanup.'
        wrong_pattern: |
          onRender={({ svg }) => svg.insertBefore(activeBand, svg.firstChild)}
        correct_pattern: |
          marks: [
            whenFocused(bandX(rows, { x: 'date' }), { match: 'x' }),
            lineY(rows, channels),
          ]
        source: 'https://github.com/TanStack/charts/issues/9; API-FRICTION.md F-178'
        priority: 'CRITICAL'
        status: 'fixed-but-legacy-risk'
      - mistake: 'Focusing a point-less rule mark'
        mechanism: 'Rules deliberately emit no interaction points, so a focus filter has no candidate identity to match.'
        wrong_pattern: |
          whenFocused(ruleX(dates), { match: 'x' })
        correct_pattern: |
          focusGuideX(rows, { x: 'date', y: 'value', xRule: {} })
        source: 'https://github.com/TanStack/charts/issues/32; API-FRICTION.md F-237'
        priority: 'HIGH'
        status: 'fixed-but-legacy-risk'
      - mistake: 'Treating controlled callbacks as complete behavior'
        mechanism: 'A range or key callback alone does not define gesture capture, keyboard operations, clamping, cancellation, or ownership; use the matching control primitive.'
        source: 'API-FRICTION.md F-075; docs/guides/interactions-and-selections.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Keeping tooltips inside clipped ancestors'
        mechanism: 'Overflow, transforms, and stacking contexts can trap native tooltip geometry even when scene coordinates are correct.'
        wrong_pattern: |
          tooltip: { use: tooltip }
        correct_pattern: |
          tooltip: { use: tooltip, portal }
        source: 'API-FRICTION.md F-133; docs/guides/tooltips-and-focus.md'
        priority: 'HIGH'
        status: 'active'

  - name: 'Update and animate charts'
    slug: 'update-and-animate-charts'
    domain: 'adapt-chart-behavior'
    description: 'Connect application state to definition identity, preserve datum identity, and use motion without corrupting responsive or streaming semantics.'
    type: 'core'
    packages: ['@tanstack/charts']
    covers:
      - 'definition identity as the update boundary'
      - 'framework memoization and captured values'
      - 'stable mark and datum keys'
      - 'SVG animation, motion, interruption, and resize policy'
      - 'streaming and rolling data'
    tasks:
      - 'Update a chart when rows or selected metrics change.'
      - 'Animate ranking, stack, or focus changes with stable identity.'
      - 'Build a streaming or rolling time-series chart.'
    failure_modes:
      - mistake: 'Creating a fresh definition on every render'
        mechanism: 'Definition identity is the runtime update boundary; unnecessary recreation invalidates work and can reset presentation state.'
        wrong_pattern: |
          <Chart definition={makeChart(rows)} ariaLabel="Revenue" />
        correct_pattern: |
          const definition = useMemo(() => makeChart(rows), [rows])
          return <Chart definition={definition} ariaLabel="Revenue" />
        source: 'CHANGELOG.md definition-identity migration; docs/guides/dynamic-data-and-animation.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Keying changing entities by row position'
        mechanism: 'Reordering, insertion, and deletion then retarget geometry, focus, tooltips, and exit motion to the wrong datum.'
        wrong_pattern: |
          barX(rows, { x: 'value', y: 'name', key: (_row, i) => i })
        correct_pattern: |
          barX(rows, { x: 'value', y: 'name', key: 'id' })
        source: 'API-FRICTION.md F-131 and F-239; docs/guides/dynamic-data-and-animation.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Animating every responsive resize'
        mechanism: 'Continuous container observation can restart transitions and make layout lag behind the actual panel size.'
        wrong_pattern: |
          svgAnimation: { resize: true }
        correct_pattern: |
          svgAnimation: true
        source: 'API-FRICTION.md F-129; docs/guides/responsive-charts.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Morphing rolling samples by array index'
        mechanism: 'When a window shifts, index identity makes old samples become different times instead of exiting and entering at the edges.'
        source: 'API-FRICTION.md F-240; docs/guides/dynamic-data-and-animation.md'
        priority: 'HIGH'
        status: 'active'

  - name: 'Coordinate charts with TanStack'
    slug: 'coordinate-charts-with-tanstack'
    domain: 'adapt-chart-behavior'
    description: 'Coordinate Charts with TanStack Table, DB, Query, Store, Router, Virtual, Pacer, Start, and Form through explicit data, state, revision, and lifecycle ownership.'
    type: 'composition'
    packages:
      - '@tanstack/charts'
      - '@tanstack/table-core'
      - '@tanstack/db'
      - '@tanstack/query-core'
      - '@tanstack/store'
      - '@tanstack/router-core'
      - '@tanstack/virtual-core'
      - '@tanstack/pacer'
    covers:
      - 'chart and data-grid row projection, filtering, grouping, pagination, and selection'
      - 'Query freshness and DB live-query, sync, optimistic, persistence, and rollback state'
      - 'semantic intent shared through Store or validated Router search state'
      - 'Virtual render windows versus analytical data scope'
      - 'Pacer scheduling, Form drafts, and Start SSR boundaries'
    tasks:
      - 'Build a chart summary and paginated data grid from one semantic projection.'
      - 'Connect a live synchronized DB query to chart and grid without duplicating reactive state.'
      - 'Coordinate chart selection, URL filters, virtual rows, optimistic edits, and paced updates.'
    reference_candidates:
      - topic: 'TanStack Table and data-grid coordination'
        reason: 'Source, filtered, grouped, sorted, paginated, selected, and virtual row frontiers answer different analytical questions.'
      - topic: 'TanStack Query, DB, and sync engines'
        reason: 'Freshness, live projections, optimistic state, persistence, rollback, and pressure policies must remain visible to the chart story.'
      - topic: 'TanStack application state and lifecycle'
        reason: 'Router, Store, Virtual, Pacer, Start, and Form own different state lifetimes that should not be mirrored in chart behavior.'
    failure_modes:
      - mistake: 'Charting the final rendered row model accidentally'
        mechanism: 'The final grid row model can include presentation sorting, grouping, expansion, and pagination that silently changes the chart population.'
        source: 'https://tanstack.com/table/latest/docs/guide/row-models'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Keying coordination by row or virtual index'
        mechanism: 'Indexes and presentation IDs change under sorting, filtering, grouping, pagination, streaming, and virtualization, retargeting selection and motion.'
        source: 'TanStack Table rows guide; API-FRICTION.md F-120, F-131, and F-239'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Duplicating filtering and aggregation'
        mechanism: 'Independent grid and chart pipelines drift on eligibility, null policy, denominators, time boundaries, and metric revisions.'
        source: 'docs/guides/transforms-and-reactivity.md; API-FRICTION.md F-128 and F-163'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Creating a bidirectional state loop'
        mechanism: 'Chart, grid, Store, and Router callbacks echo equivalent updates and create redundant renders, history spam, flicker, or state that cannot settle.'
        source: 'docs/guides/interactions-and-selections.md; TanStack Router search-parameter guidance'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Treating optimistic rows as confirmed history'
        mechanism: 'A synchronized collection can expose pending values before persistence and later normalize or roll them back, changing what the visual claim means.'
        source: 'https://tanstack.com/db/latest/docs/guides/mutations'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Persisting every interaction frame'
        mechanism: 'Pointer-rate writes to Router, Query invalidation, or DB transactions turn disposable presentation into expensive, conflicting, or irreversible state.'
        source: 'docs/guides/interactions-and-selections.md; TanStack Pacer timing guidance'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Treating virtualization as analytical filtering'
        mechanism: 'Virtual controls which rows are mounted, not which records belong to the metric, unless visible rows are explicitly the question.'
        source: 'https://tanstack.com/virtual/latest/docs/api/virtualizer'
        priority: 'HIGH'
        status: 'active'

  - name: 'Migrate charts to TanStack Charts'
    slug: 'migrate-to-tanstack-charts'
    domain: 'ship-and-evolve-charts'
    description: 'Migrate an existing chart semantically, preserve application-owned behavior, and prove parity before removing the source renderer.'
    type: 'composition'
    packages: ['@tanstack/charts']
    covers:
      - 'semantic inventory and ownership boundaries'
      - 'layer-by-layer translation to data, channels, transforms, marks, scales, and controls'
      - 'visual, interaction, accessibility, export, bundle, and performance parity'
      - 'compatibility package and current subpath migration'
    tasks:
      - 'Migrate an Observable Plot chart without copying generated DOM.'
      - 'Migrate Recharts, Chart.js, ECharts, or a custom D3 renderer.'
      - 'Replace a renderer behind a temporary production comparison switch.'
    subsystems:
      - name: 'Observable Plot'
        package: '@observablehq/plot'
        config_surface: 'marks, transforms, scales, facets, pointer interactions, and generated SVG'
      - name: 'Recharts'
        package: 'recharts'
        config_surface: 'React component tree, implicit series data, shapes, axes, and tooltip state'
      - name: 'Chart.js'
        package: 'chart.js'
        config_surface: 'dataset configuration, plugins, canvas lifecycle, and imperative updates'
      - name: 'ECharts'
        package: 'echarts'
        config_surface: 'option objects, dataZoom, axisPointer, dispatch actions, and renderer state'
      - name: 'D3'
        package: 'd3-*'
        config_surface: 'application-owned selections, scales, layouts, gestures, and DOM lifecycle'
    failure_modes:
      - mistake: 'Translating component names one for one'
        mechanism: 'Library components combine different data, geometry, scale, and interaction ownership, so name matching preserves syntax rather than behavior.'
        source: 'docs/guides/migrating.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Replacing transforms and renderer together'
        mechanism: 'Changing analytical preparation during a renderer migration makes visual drift impossible to classify.'
        source: 'docs/guides/migrating.md; packages/charts-core-d3/docs/tanstack-stats-migration.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Calling screenshot similarity complete parity'
        mechanism: 'A static image does not prove focus grouping, keyboard behavior, updates, pinning, export, performance, or bundle ownership.'
        source: 'API-FRICTION.md F-036, F-073, and F-081; docs/guides/migrating.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Reimplementing source-library internals blindly'
        mechanism: 'Keep proven D3, SQL, server, or application transforms first; migrate only ownership that TanStack Charts can express and verify.'
        source: 'docs/guides/migrating.md; API-FRICTION.md F-127'
        priority: 'HIGH'
        status: 'active'
    compositions:
      - library: 'Observable Plot'
        skill: 'migrate-to-tanstack-charts'
      - library: 'Recharts'
        skill: 'migrate-to-tanstack-charts'
      - library: 'Chart.js'
        skill: 'migrate-to-tanstack-charts'
      - library: 'ECharts'
        skill: 'migrate-to-tanstack-charts'
      - library: 'D3'
        skill: 'migrate-to-tanstack-charts'

  - name: 'Ship accessible charts'
    slug: 'ship-accessible-charts'
    domain: 'ship-and-evolve-charts'
    description: 'Deliver deterministic, accessible charts through the correct framework, renderer, SSR, export, and native lifecycle boundaries.'
    type: 'lifecycle'
    packages:
      - '@tanstack/charts'
      - '@tanstack/react-charts'
      - '@tanstack/react-native-charts'
      - '@tanstack/octane-charts'
      - '@tanstack/preact-charts'
      - '@tanstack/vue-charts'
      - '@tanstack/solid-charts'
      - '@tanstack/svelte-charts'
      - '@tanstack/angular-charts'
      - '@tanstack/lit-charts'
      - '@tanstack/alpine-charts'
    covers:
      - 'accessible name, description, keyboard, selection, and adjacent summaries'
      - 'SSR, hydration, deterministic IDs, and initial size'
      - 'framework adapter mount, update, and cleanup'
      - 'SVG, Canvas, React Native SVG, static rendering, and export'
      - 'exact package subpaths and optional capability boundaries'
    tasks:
      - 'Ship a server-rendered chart without hydration drift.'
      - 'Provide keyboard and assistive-technology access to important values.'
      - 'Choose SVG, Canvas, React Native SVG, or static export.'
    subsystems:
      - name: 'DOM framework adapters'
        package: '@tanstack/charts/* framework subpaths'
        config_surface: 'SSR prerender, client mount/update, native tooltip body composition, and cleanup'
      - name: 'React Native'
        package: '@tanstack/charts/react-native'
        config_surface: 'native layout, typography, paint resolution, accessibility actions, and react-native-svg'
      - name: 'Renderers and export'
        package: '@tanstack/charts'
        config_surface: 'SVG, Canvas, renderer-neutral hosts, serialization, and raster export'
    reference_candidates:
      - topic: 'framework lifecycle deviations'
        reason: 'Adapters share the runtime but differ in SSR hooks, portals/slots, custom-element reconnection, and native layout.'
    failure_modes:
      - mistake: 'Using a generic accessible label'
        mechanism: 'A label such as chart or graph does not identify the metric, comparison, period, or unit needed to understand the graphic.'
        source: 'docs/guides/accessibility.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Making the chart the only critical representation'
        mechanism: 'Dense or precise operational values need an adjacent summary, table, or equivalent application interaction.'
        source: 'docs/guides/accessibility.md; packages/charts-core-d3/docs/responsive-theme-accessibility.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Mounting the browser host during server rendering'
        mechanism: 'Measurement and DOM mutation require real browser elements; server rendering should prerender deterministic SVG and mount only on the client.'
        wrong_pattern: |
          ngAfterViewInit() { this.adapter.mount(this.surface.nativeElement) }
        correct_pattern: |
          afterNextRender(() => {
            this.adapter.mount(this.surface.nativeElement)
          })
        source: 'https://github.com/TanStack/charts/issues/56; docs/guides/ssr-and-hydration.md'
        priority: 'CRITICAL'
        status: 'fixed-but-legacy-risk'
      - mistake: 'Putting chart behavior on adapter props'
        mechanism: 'Focus, tooltip, keyboard, cursors, controls, and SVG animation belong to the reusable definition; adapters own surface and callback lifecycle.'
        wrong_pattern: |
          <Chart definition={chart} tooltip keyboard />
        correct_pattern: |
          const interactive = defineChart(chart, { tooltip, keyboard: true })
          <Chart definition={interactive} ariaLabel="Revenue by month" />
        source: 'CHANGELOG.md chart-behavior migration; docs/framework/react/reference/chart.md'
        priority: 'HIGH'
        status: 'fixed-but-legacy-risk'
      - mistake: 'Importing the universal barrel on native by default'
        mechanism: 'Metro can retain browser and optional capability code; exact core and native subpaths protect the native bundle and declaration environment.'
        source: 'API-FRICTION.md F-154, F-171, F-173, and F-256; packages/react-native-charts/README.md'
        priority: 'HIGH'
        status: 'active'

  - name: 'Debug and verify charts'
    slug: 'debug-and-verify-charts'
    domain: 'ship-and-evolve-charts'
    description: 'Diagnose type, geometry, data, interaction, lifecycle, bundle, and performance failures with evidence that matches the user-visible behavior.'
    type: 'lifecycle'
    packages: ['@tanstack/charts']
    covers:
      - 'type-inference diagnosis'
      - 'empty, missing, duplicate, negative, and invalid data cases'
      - 'scene and rendered geometry inspection'
      - 'pointer, keyboard, update, and teardown scenarios'
      - 'packed-package, bundle, and performance verification'
    tasks:
      - 'Fix a type error without erasing chart inference.'
      - 'Explain why a chart is blank, clipped, misleading, or hard to focus.'
      - 'Prove a migration or optimization with executable scenarios.'
    failure_modes:
      - mistake: 'Casting a rejected chart definition'
        mechanism: 'A cast hides an inaccurate row type, incompatible channel, wrong scale domain, mixed union, or custom mark contract and leaves the runtime mismatch intact.'
        wrong_pattern: |
          <Chart definition={definition as any} ariaLabel="Revenue" />
        correct_pattern: |
          // Correct the row, channel, scale, or custom mark type at its source.
          <Chart definition={definition} ariaLabel="Revenue" />
        source: 'docs/guides/typescript.md; docs/reference/types.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Asserting only that an element exists'
        mechanism: 'Presence does not prove correct geometry, containment, tooltip state, focused datum, keyboard order, or update behavior.'
        source: 'API-FRICTION.md F-036, F-073, and F-081; docs/guides/testing-and-debugging.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Testing workspace source instead of packed exports'
        mechanism: 'Workspace resolution can hide missing exports, browser globals, peer requirements, and retained optional dependencies that fail for consumers.'
        source: 'API-FRICTION.md F-090, F-139, F-167, and F-224'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Trusting one aggregate performance number'
        mechanism: 'Representation cost, sustained pointer work, update correctness, and dashboard lifecycle can disappear inside one mount median or one-shot probe.'
        source: 'API-FRICTION.md F-078 through F-084; docs/guides/bundle-size-and-performance.md'
        priority: 'HIGH'
        status: 'active'

  - name: 'Extend TanStack Charts'
    slug: 'extend-tanstack-charts'
    domain: 'ship-and-evolve-charts'
    description: 'Implement custom marks, layouts, renderers, controls, and composed views only where built-in primitives cannot express the required semantics.'
    type: 'core'
    packages: ['@tanstack/charts']
    covers:
      - 'createMark and scale-value variants'
      - 'renderer-neutral scene nodes and interaction points'
      - 'resolved-layout marks and final-pixel work'
      - 'custom renderers and host extensions'
      - 'composable view ownership boundaries'
    tasks:
      - 'Build a bespoke Cartesian mark that retains native scales and focus.'
      - 'Add a final-bounds layout without DOM access or side effects.'
      - 'Implement a renderer or host extension with typed scene callbacks.'
    reference_candidates:
      - topic: 'extension protocols'
        reason: 'Marks, resolved layouts, scenes, renderers, host extensions, controls, and composable views are separate ownership boundaries.'
    failure_modes:
      - mistake: 'Reading or mutating the DOM during scene generation'
        mechanism: 'Scene compilation must remain deterministic and renderer-neutral for SSR, Canvas, React Native, export, and testing.'
        source: 'docs/guides/custom-marks-and-renderers.md; packages/charts-core/src/mark.ts'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Inferring a private positional domain during render'
        mechanism: 'The chart cannot coordinate guides, layers, focus, or linked views unless a mark declares materialized scale channels before rendering.'
        source: 'docs/reference/custom-extensions.md; packages/charts-core-d3/docs/custom-marks.md'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Conflating interaction and scale values'
        mechanism: 'Interval and custom layouts may focus one semantic value while materializing several endpoints; createMark alone can make axis requirements and callbacks dishonest.'
        wrong_pattern: |
          createMark<Datum, PointX, PointY>(initialize)
        correct_pattern: |
          createMarkWithScaleValues<Datum, PointX, PointY, ScaleX, ScaleY>(
            initialize,
          )
        source: 'API-FRICTION.md F-094; docs/reference/types.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Running side effects in resolved-layout callbacks'
        mechanism: 'Margin solving and responsive layout may evaluate callbacks more than once; reducers and child builders must be pure, synchronous, and deterministic.'
        source: 'docs/reference/marks/hexbin.md; docs/reference/marks/sankey.md'
        priority: 'HIGH'
        status: 'active'

tensions:
  - name: 'Analytical honesty versus visual simplicity'
    skills: ['design-a-chart', 'prepare-chart-data']
    description: 'Aggregation, normalization, projection, and missing-value policy can simplify a chart while hiding the evidence needed to interpret it.'
    implication: 'An agent optimizes appearance before preserving denominators, lineage, uncertainty, and comparison validity.'
  - name: 'Responsive adaptation versus comparison stability'
    skills: ['design-responsive-charts', 'configure-scales-guides-color']
    description: 'Narrow layouts need fewer labels and different composition, but changing domains or semantics breaks comparison across sizes.'
    implication: 'An agent makes the chart fit by silently changing what positions or colors mean.'
  - name: 'Rich interaction versus portable rendering'
    skills:
      [
        'build-chart-interactions',
        'ship-accessible-charts',
        'extend-tanstack-charts',
      ]
    description: 'DOM conveniences can produce rich local UI while breaking SSR, Canvas, React Native, export, or keyboard equivalence.'
    implication: 'An agent reaches for DOM mutation before renderer-neutral marks, controls, or host extensions.'
  - name: 'Motion continuity versus current-state correctness'
    skills:
      [
        'update-and-animate-charts',
        'design-responsive-charts',
        'debug-and-verify-charts',
      ]
    description: 'Long or interrupted transitions can preserve visual continuity while presenting stale geometry after updates or resize.'
    implication: 'An agent verifies only final frames and misses stale focus, guides, or latest-wins behavior during interruption.'
  - name: 'Local responsiveness versus synchronized truth'
    skills:
      [
        'coordinate-charts-with-tanstack',
        'build-chart-interactions',
        'update-and-animate-charts',
      ]
    description: 'Immediate local feedback can outrun shared filters, server revisions, optimistic persistence, or rollback.'
    implication: 'An agent makes the chart feel responsive while chart, grid, URL, and synchronized data no longer describe the same accepted state.'

